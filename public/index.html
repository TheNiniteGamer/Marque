<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Marquee</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topnav" id="topnav">
    <a href="#/" class="brand" aria-label="Marquee home">MARQUEE</a>
    <nav class="nav-links" id="nav-links" aria-label="Main"></nav>
    <div class="nav-right">
      <form class="search" id="search-form" role="search">
        <button type="button" class="icon-btn search-btn" id="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
        <input id="search-input" type="search" placeholder="Titles, genres, episodes" autocomplete="off" aria-label="Search">
      </form>
      <button type="button" class="icon-btn voice-btn" id="voice-btn" aria-label="Search by voice" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <div class="scan-indicator" id="scan-indicator" hidden></div>
      <div class="bell" id="bell" hidden>
        <button type="button" class="icon-btn" id="bell-btn" aria-label="Notifications" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 003.4 0"></path></svg><span class="bell-count" id="bell-count" hidden></span></button>
        <div class="bell-pop" id="bell-pop" hidden></div>
      </div>
      <div class="user-menu" id="user-menu"></div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="detail-root"></div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div id="player-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/tv.js"></script>
  <script src="/cast.js"></script>
  <script src="/manage.js"></script>
  <script src="/extras.js"></script>
  <script src="/select.js"></script>
  <script src="/requests.js"></script>
  <script src="/settings.js"></script>
  <script src="/app.js"></script>
</body>
</html>
