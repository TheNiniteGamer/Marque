# Marquee with Docker Compose. Settings come from the .env file next to this one
# (copy .env.example to .env and edit it, or let start-marquee.bat do it for you on Windows).
# Docker keeps what each container prints; cap it at 3 files of 10 MB so it can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  marquee:
    build:
      context: .
      args:
        # Set by marquee.ps1 so the app knows which version it is (for update checks).
        MARQUEE_COMMIT: ${MARQUEE_COMMIT:-}
        MARQUEE_BUILT_AT: ${MARQUEE_BUILT_AT:-}
    image: marquee:latest
    container_name: marquee
    restart: unless-stopped
    logging: *logging
    ports:
      - "${MARQUEE_PORT:-32500}:32500"
    environment:
      TZ: ${TZ:-UTC}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30}
      TRANSCODE_PRESET: ${TRANSCODE_PRESET:-veryfast}
      # Video converter: auto (use a graphics card if one works), software, nvenc, qsv or vaapi.
      # The graphics card itself is passed in by docker-compose.nvidia.yml / docker-compose.intel-amd.yml (GPU= in .env).
      HWACCEL: ${HWACCEL:-auto}
      # Address Chromecasts use to reach Marquee (marquee.ps1 fills in this PC's network address).
      CAST_URL: ${CAST_URL:-}
      # Update checks look at this GitHub repository; the helper and the app talk through /control.
      MARQUEE_REPO: ${MARQUEE_REPO:-TheNiniteGamer/Marque}
      CONTROL_DIR: /control
      # Nightly backups land in a folder you can see on your PC (BACKUP_DIR in .env).
      BACKUP_DIR: /backups
      BACKUP_LABEL: ${BACKUP_DIR:-./backups}
      # Which remote-access helpers are switched on (filled in by marquee.ps1 from your .env).
      REMOTE_ACCESS: ${COMPOSE_PROFILES:-}
      # Libraries built from the folders below. Extra drives (…_2, …_3, …_4) are only included when set
      # in .env, and folders added there later are attached to the existing library on the next start.
      AUTO_LIBRARIES: >-
        Movies:movie:/media/movies${MOVIES_DIR_2:+,/media/movies2}${MOVIES_DIR_3:+,/media/movies3}${MOVIES_DIR_4:+,/media/movies4};
        TV Shows:show:/media/tv${TV_DIR_2:+,/media/tv2}${TV_DIR_3:+,/media/tv3}${TV_DIR_4:+,/media/tv4};
        YouTube:movie:/media/youtube
      # Lets the web UI show your real folder names (e.g. E:/Movies) instead of /media/movies2.
      MEDIA_LABELS: >-
        /media/movies=${MOVIES_DIR:-}|/media/movies2=${MOVIES_DIR_2:-}|/media/movies3=${MOVIES_DIR_3:-}|/media/movies4=${MOVIES_DIR_4:-}|
        /media/tv=${TV_DIR:-}|/media/tv2=${TV_DIR_2:-}|/media/tv3=${TV_DIR_3:-}|/media/tv4=${TV_DIR_4:-}|
        /media/youtube=${YOUTUBE_DIR:-}
    volumes:
      # Database, thumbnails and caches (a Docker-managed volume; survives updates).
      - marquee-data:/data
      # Shared with the update helper on your PC (marquee.ps1 Watch).
      - ./control:/control
      - "${BACKUP_DIR:-./backups}:/backups"
      # Your media. On Windows use forward slashes, e.g. MOVIES_DIR=D:/Movies
      - "${MOVIES_DIR:-./media/movies}:/media/movies"
      - "${MOVIES_DIR_2:-./media/unused/movies2}:/media/movies2"
      - "${MOVIES_DIR_3:-./media/unused/movies3}:/media/movies3"
      - "${MOVIES_DIR_4:-./media/unused/movies4}:/media/movies4"
      - "${TV_DIR:-./media/tv}:/media/tv"
      - "${TV_DIR_2:-./media/unused/tv2}:/media/tv2"
      - "${TV_DIR_3:-./media/unused/tv3}:/media/tv3"
      - "${TV_DIR_4:-./media/unused/tv4}:/media/tv4"
      # Where the YouTube downloader saves videos.
      - "${YOUTUBE_DIR:-./media/youtube}:/media/youtube"

  # ---- Watching away from home (optional; switched on by filling in a key in .env) ----

  # Tailscale: private HTTPS address like https://marquee.your-tailnet.ts.net for your own devices.
  tailscale:
    image: tailscale/tailscale:stable
    profiles: [tailscale]
    container_name: marquee-tailscale
    hostname: ${TS_HOSTNAME:-marquee}
    restart: unless-stopped
    logging: *logging
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-marquee}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"          # no special network permissions needed (works on Docker Desktop)
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # TAILSCALE_PUBLIC=true also lets people without Tailscale reach it (Tailscale Funnel).
      - ./remote/tailscale-serve${TAILSCALE_PUBLIC:+-funnel}.json:/config/serve.json:ro
    depends_on: [marquee]

  # Cloudflare Tunnel: your own domain, e.g. https://movies.example.com (needs a Cloudflare account + domain).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    container_name: marquee-cloudflared
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [marquee]

volumes:
  marquee-data:
  tailscale-state:
