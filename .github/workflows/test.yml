# Runs every test on each push, inside the same Docker image the server uses (Node 22 and
# Jellyfin's ffmpeg), so a passing run here means the same as `npm test` on the server PC.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t marquee-ci .
      - name: Run the tests
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src --entrypoint sh marquee-ci -c 'node --test test/*.test.js'
